[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pageledger"
version = "0.1.7"
description = "Auditable page-level run ledger for OCR and document extraction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Peter Busscher"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing",
]
keywords = [
  "document-ai",
  "document-extraction",
  "document-processing",
  "data-provenance",
  "ocr",
  "ocr-pipeline",
  "vlm",
  "digital-humanities",
]
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.0",
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.9",
  "twine>=6.0",
  "types-PyYAML>=6.0",
]
pdf = [
  "pypdf>=6",
]

[project.urls]
Homepage = "https://github.com/peterbussch/pageledger"
Documentation = "https://github.com/peterbussch/pageledger/blob/main/docs/README.md"
"Artifact Reference" = "https://github.com/peterbussch/pageledger/blob/main/docs/artifacts.md"
"PDF/OCR First Run" = "https://github.com/peterbussch/pageledger/blob/main/docs/pdf-ocr-first-run.md"
"OCR Options" = "https://github.com/peterbussch/pageledger/blob/main/docs/ocr-options.md"
Issues = "https://github.com/peterbussch/pageledger/issues"
Source = "https://github.com/peterbussch/pageledger"

[project.scripts]
pageledger = "pageledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pageledger*"]

[tool.setuptools.data-files]
"share/pageledger/schemas" = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes. I: import order. B: bugbear. UP: modernize.
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # long lines in docstrings/messages; formatter not enforced
]

[tool.pytest.ini_options]
markers = [
    "stress: Stress/performance tests that generate large synthetic inputs (skipped in default CI)",
]

[tool.mypy]
python_version = "3.10"
files = ["pageledger"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true
