name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verify the tagged artifact, or publish it to PyPI after approval
        required: true
        default: verify
        type: choice
        options:
          - verify
          - pypi
      production_confirmation:
        description: For PyPI, type the exact release tag (for example v0.3.0a1)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Require an exact release tag and matching tracked metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          PUBLISH_TARGET: ${{ inputs.target }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          test "$RELEASE_REF_TYPE" = "tag" || {
            echo "Publish must be manually dispatched from an existing tag." >&2
            exit 1
          }
          python scripts/check_release.py "$RELEASE_TAG"
          if [ "$PUBLISH_TARGET" = "pypi" ]; then
            test "$PRODUCTION_CONFIRMATION" = "$RELEASE_TAG" || {
              echo "PyPI publication requires typing the exact release tag." >&2
              exit 1
            }
          fi
      - name: Require protected PyPI environment before production
        if: inputs.target == 'pypi'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def get_json(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except (OSError, urllib.error.HTTPError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      "Could not verify PyPI environment protections; refusing publication"
                  ) from exc

          environment = get_json("environments/pypi")
          rules = environment.get("protection_rules", [])
          if not any(rule.get("type") == "required_reviewers" for rule in rules):
              raise SystemExit("PyPI environment has no required reviewer")
          if environment.get("can_admins_bypass") is not False:
              raise SystemExit("PyPI environment must disable administrator bypass")
          deployment_policy = environment.get("deployment_branch_policy")
          if not isinstance(deployment_policy, dict) or not deployment_policy.get(
              "custom_branch_policies"
          ):
              raise SystemExit("PyPI environment must use selected tag policies")
          policies = get_json("environments/pypi/deployment-branch-policies")
          entries = policies.get("branch_policies", [])
          allowed_policy_names = {entry.get("name") for entry in entries}
          if (
              policies.get("total_count") != 1
              or len(entries) != 1
              or entries[0].get("type") != "tag"
              or allowed_policy_names != {"v*"}
          ):
              raise SystemExit("PyPI environment must have only the v* deployment pattern")
          print("PyPI environment protections verified")
          PY
      - name: Recreate the locked verification environment
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev --extra pdf
      - name: Verify release source
        run: |
          uv run --frozen --extra dev --extra pdf ruff check pageledger/ tests/ examples/ scripts/
          uv run --frozen --extra dev --extra pdf mypy pageledger/
          uv run --frozen --extra dev --extra pdf python -m pytest tests/pageledger/ -q -m "not stress"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Recreate the locked build environment
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev --extra pdf
      - name: Recheck release metadata and build distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --frozen --extra dev python scripts/check_release.py "$RELEASE_TAG"
          uv run --frozen --extra dev python -m build
          uv run --frozen --extra dev twine check dist/*
          uv run --frozen --extra dev python -c 'from pathlib import Path; from zipfile import ZipFile; wheel=next(Path("dist").glob("*.whl")); names=ZipFile(wheel).namelist(); assert any(name.endswith(".data/data/share/pageledger/schemas/manifest.schema.json") for name in names)'
      - name: Smoke-test the exact wheel
        run: |
          python -m venv /tmp/pageledger-release-wheel
          /tmp/pageledger-release-wheel/bin/pip install "$(ls dist/pageledger-*.whl)[pdf]"
          /tmp/pageledger-release-wheel/bin/pageledger --version
          /tmp/pageledger-release-wheel/bin/pageledger doctor --json
          printf 'first page\fsecond page\n' > /tmp/pageledger-release-smoke.txt
          /tmp/pageledger-release-wheel/bin/pageledger run /tmp/pageledger-release-smoke.txt --adapter text --out /tmp/pageledger-release-run --json
          /tmp/pageledger-release-wheel/bin/pageledger verify-run /tmp/pageledger-release-run
      - name: Record distribution hashes
        run: sha256sum dist/pageledger-* > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
      - name: Remove non-package checksum file
        run: rm dist/SHA256SUMS
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
