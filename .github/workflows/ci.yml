name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: pip install ".[dev]"
      - name: Ruff check
        run: ruff check pageledger/ tests/ examples/
      - name: Mypy
        run: mypy pageledger/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["dev", "dev,pdf"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with optional PDF extra
        run: pip install ".[${{ matrix.extras }}]"
      - name: Run tests
        run: python -m pytest tests/pageledger/ -v -m "not stress"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install "$(ls dist/pageledger-*.whl)[pdf]"
          /tmp/venv-wheel/bin/pageledger init-config
          /tmp/venv-wheel/bin/pageledger doctor --json
          (cd /tmp && /tmp/venv-wheel/bin/python -c 'from importlib.metadata import files; names={str(p) for p in (files("pageledger") or [])}; assert all(any(name.endswith("share/pageledger/schemas/" + schema) for name in names) for schema in ("manifest.schema.json", "bundle.schema.json", "replay.schema.json"))')
          SOURCE=/tmp/smoke.txt
          RUN=/tmp/smoke-run
          BUNDLE=/tmp/smoke-bundle
          REPLAY=/tmp/smoke-replay
          echo "first page" > "$SOURCE"
          /tmp/venv-wheel/bin/pageledger init-config --out /tmp/smoke-config.yml
          /tmp/venv-wheel/bin/pageledger run "$SOURCE" --config /tmp/smoke-config.yml --out "$RUN" --json
          /tmp/venv-wheel/bin/pageledger verify-run "$RUN"
          /tmp/venv-wheel/bin/pageledger bundle "$RUN" --out "$BUNDLE" --json
          mv "$SOURCE" "$SOURCE.moved"
          /tmp/venv-wheel/bin/pageledger replay "$BUNDLE" --out "$REPLAY" --json
          /tmp/venv-wheel/bin/pageledger verify-run "$REPLAY"
      - name: Smoke test sdist install
        run: |
          python -m venv /tmp/venv-sdist
          /tmp/venv-sdist/bin/pip install "$(ls dist/pageledger-*.tar.gz)[pdf]"
          /tmp/venv-sdist/bin/pageledger init-config
          /tmp/venv-sdist/bin/pageledger doctor --json
          SOURCE=/tmp/smoke2.txt
          RUN=/tmp/smoke2-run
          BUNDLE=/tmp/smoke2-bundle
          REPLAY=/tmp/smoke2-replay
          printf 'page one\fpage two' > "$SOURCE"
          /tmp/venv-sdist/bin/pageledger init-config --out /tmp/smoke2-config.yml
          /tmp/venv-sdist/bin/pageledger run "$SOURCE" --config /tmp/smoke2-config.yml --out "$RUN" --json
          /tmp/venv-sdist/bin/pageledger verify-run "$RUN"
          /tmp/venv-sdist/bin/pageledger bundle "$RUN" --out "$BUNDLE" --json
          mv "$SOURCE" "$SOURCE.moved"
          /tmp/venv-sdist/bin/pageledger replay "$BUNDLE" --out "$REPLAY" --json
          /tmp/venv-sdist/bin/pageledger verify-run "$REPLAY"

  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Recreate and verify the committed lock
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev --extra pdf
          uv run --frozen --extra dev --extra pdf ruff check pageledger/ tests/ examples/ scripts/
          uv run --frozen --extra dev --extra pdf mypy pageledger/
          uv run --frozen --extra dev --extra pdf python -m pytest tests/pageledger/ -q -m "not stress"
