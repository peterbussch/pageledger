name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: pip install ".[dev]"
      - name: Ruff check
        run: ruff check pageledger/ tests/ examples/
      - name: Mypy
        run: mypy pageledger/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["dev", "dev,pdf"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with optional PDF extra
        run: pip install ".[${{ matrix.extras }}]"
      - name: Install Poppler, Tesseract and xmllint for the Python 3.13 PDF lane
        if: matrix.python-version == '3.13' && matrix.extras == 'dev,pdf'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libxml2-utils
          pip install Pillow==12.3.0
      - name: Run the PDF/OCR tutorial on a generated scan
        if: matrix.python-version == '3.13' && matrix.extras == 'dev,pdf'
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          font = ImageFont.load_default(size=40)
          pages = []
          for text in ("A scanned page for the PageLedger tutorial.", "Its second page."):
              page = Image.new("RGB", (1700, 2200), "white")
              ImageDraw.Draw(page).text((150, 300), text, font=font, fill="black")
              pages.append(page)
          pages[0].save("document.pdf", "PDF", resolution=200, save_all=True, append_images=pages[1:])
          PY
          python examples/run_first_run.py \
            --document docs/pdf-ocr-first-run.md \
            --work-dir "$RUNNER_TEMP/pdf-ocr-tutorial" \
            --python "$(command -v python)" \
            --source-root . \
            --fixture document.pdf
      - name: Run tests
        run: python -m pytest tests/pageledger/ -v -m "not stress"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Validate distribution inventories
        run: |
          python scripts/check_distributions.py dist
      - name: Smoke test wheel install
        env:
          PYTHONPATH: ""
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install "$(ls dist/pageledger-*.whl)[pdf]"
          /tmp/venv-wheel/bin/pageledger init-config
          /tmp/venv-wheel/bin/pageledger doctor --json
          (cd /tmp && /tmp/venv-wheel/bin/python -c 'from importlib.metadata import files; names={str(p) for p in (files("pageledger") or [])}; assert all(any(name.endswith("share/pageledger/schemas/" + schema) for name in names) for schema in ("manifest.schema.json", "bundle.schema.json", "replay.schema.json"))')
          WORK_ROOT="$(mktemp -d)"
          /tmp/venv-wheel/bin/python examples/run_first_run.py \
            --document "$GITHUB_WORKSPACE/docs/first-run.md" \
            --work-dir "$WORK_ROOT/first-run" \
            --python /tmp/venv-wheel/bin/python \
            --expected-version 0.6.0 \
            --forbid-import-root "$GITHUB_WORKSPACE"
          /tmp/venv-wheel/bin/python examples/run_first_run.py \
            --document "$GITHUB_WORKSPACE/docs/document-first-run.md" \
            --work-dir "$WORK_ROOT/document-first-run" \
            --python /tmp/venv-wheel/bin/python \
            --expected-version 0.6.0 \
            --forbid-import-root "$GITHUB_WORKSPACE"
      - name: Smoke test sdist install
        env:
          PYTHONPATH: ""
        run: |
          python -m venv /tmp/venv-sdist
          /tmp/venv-sdist/bin/pip install "$(ls dist/pageledger-*.tar.gz)[pdf]"
          /tmp/venv-sdist/bin/pageledger init-config
          /tmp/venv-sdist/bin/pageledger doctor --json
          (cd /tmp && /tmp/venv-sdist/bin/python -c 'from importlib.metadata import files; names={str(p) for p in (files("pageledger") or [])}; assert all(any(name.endswith("share/pageledger/schemas/" + schema) for name in names) for schema in ("manifest.schema.json", "bundle.schema.json", "replay.schema.json"))')
          WORK_ROOT="$(mktemp -d)"
          /tmp/venv-sdist/bin/python examples/run_first_run.py \
            --document "$GITHUB_WORKSPACE/docs/first-run.md" \
            --work-dir "$WORK_ROOT/first-run" \
            --python /tmp/venv-sdist/bin/python \
            --expected-version 0.6.0 \
            --forbid-import-root "$GITHUB_WORKSPACE"
          /tmp/venv-sdist/bin/python examples/run_first_run.py \
            --document "$GITHUB_WORKSPACE/docs/document-first-run.md" \
            --work-dir "$WORK_ROOT/document-first-run" \
            --python /tmp/venv-sdist/bin/python \
            --expected-version 0.6.0 \
            --forbid-import-root "$GITHUB_WORKSPACE"

  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Recreate and verify the committed lock
        run: |
          python -m pip install uv==0.11.16
          uv sync --frozen --extra dev --extra pdf
          uv run --frozen --extra dev --extra pdf ruff check pageledger/ tests/ examples/ scripts/
          uv run --frozen --extra dev --extra pdf ruff format --check pageledger/ tests/ examples/ scripts/
          uv run --frozen --extra dev --extra pdf mypy pageledger/
          uv run --frozen --extra dev --extra pdf python -m pytest tests/pageledger/ -q -m "not stress"
