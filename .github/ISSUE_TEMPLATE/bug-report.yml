name: Bug report
description: Something broke or behaved incorrectly (report security problems privately, as SECURITY.md explains)
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: The output of `pageledger --version`, your Python version and operating system.
      placeholder: "e.g. pageledger X.Y.Z, Python 3.12, macOS 15"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and, if possible, a minimal input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / traceback
      description: Review before posting; remove credentials, private paths, document contents, and other sensitive data.
      render: text
    validations:
      required: false
