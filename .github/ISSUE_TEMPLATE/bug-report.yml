name: Bug report
description: Something broke or behaved incorrectly
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: "e.g. pageledger 0.2.0, Python 3.12, macOS 15"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and, if possible, a minimal input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / traceback
      description: Review before posting; remove credentials, private paths, document contents, and other sensitive data.
      render: text
    validations:
      required: false
