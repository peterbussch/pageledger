# Document job: local PDF text followed by OCR for weak pages.
schema_version: "0.1"
processing:
  local_text:
    adapter: pdf_text
  local_ocr:
    adapter: pdf_ocr
    adapter_options:
      lang: eng
      dpi: 300
  limits:
    max_attempt_pages: 100
    max_image_pages: 0
  # Optional: send the pages OCR could not read to a vision model. This needs
  # an OpenAI-compatible endpoint that serves the model (see
  # docs/vision-adapter.md) and a positive limits.max_image_pages.
  # image:
  #   adapter: vision
  #   adapter_options:
  #     base_url: http://127.0.0.1:8080/v1
  #     model: YOUR_VISION_MODEL
  # A second_opinion stage can ask a second model in the same way.
