# Combined PageLedger config (artifact/config schema 0.1, package 0.4.0).
#
# The split files in this examples directory are easier to read in docs. This
# single-file form is the recommended first-use shape.

schema_version: "0.1"  # Config file format version.

dataset_citation:
  label: Example source collection
  text: Replace this with the archive, collection, DOI, or source-image citation.

taxonomy:
  # The built-in classifier can emit exactly these five structural types.
  # Domain types require a classify.hook (see docs/classifier.md).
  page_types:
    blank:
      default_action: skip
    sparse:
      default_action: review
    prose:
      default_action: transcribe_text
    table_likely:
      default_action: review
    unknown:
      default_action: review

classify:
  # Omit for per-suffix defaults: pdf_text for PDF, text otherwise.
  # adapter: pdf_ocr
  min_confidence: 0.5
  # thresholds:
  #   table_column_line_ratio: 0.015

# The schema aligner maps structured extractor output (markdown_table,
# json, csv) to these columns, writing normalized/{page_id}.json records.
# Header matching is exact against names and aliases; coercion failures
# and failed checks are recorded, never silently fixed. Plain-text pages
# are not aligned and grade on signals alone.
schema:
  name: demographic_table
  # Projects can add their own language-specific aliases here.
  columns:
    - name: place_name
      aliases: [place, settlement, locality]
      type: string
      required: true
    - name: population_total
      aliases: [total, population]
      type: integer
      required: true
    - name: population_male
      aliases: [male, men]
      type: integer
    - name: population_female
      aliases: [female, women]
      type: integer
  checks:
    - name: population_sum
      expression: population_total == population_male + population_female
      tolerance: 2
  quality:
    # Grading floors: required-column coverage below the minimum forces the
    # schema axis to F; page confidence under the threshold caps the grade at C.
    minimum_required_column_coverage: 1.0
    low_confidence_threshold: 0.70

run:
  # Fixture adapter for plain UTF-8 text inputs. Use pdf_text for born-digital
  # PDFs or pdf_ocr for scanned PDFs.
  adapter: text
  # For generation-indexed escalation, remove `adapter` above and use a
  # non-empty chain. Entry 0 runs first; rerun generation 1 uses entry 1.
  # adapter_order:
  #   - text
  #   - adapter: module.path:StrongerAdapter
  #     adapter_options: {model: stronger-model}
  budget:
    # The page is canonical and always available. Token caps need adapter token
    # usage; dollar caps need adapter-reported cost or rates under `pricing`.
    max_pages: 5000
    max_usd: 25
    warn_at_percent: 80
    # Absolute warnings fire without requiring a cap. When both forms exist,
    # the lower threshold wins and an exact tie is attributed to the absolute.
    warn_pages: 4000
    warn_tokens: 500000
    warn_usd: 20
  # max_rerun_depth: 2  # generations of `pageledger rerun` allowed (default 2)
  retry:
    max_retries: 3
    backoff: exponential
  # Continue independent later pages after retries are exhausted. The final
  # run is partial and exits nonzero if any page failed.
  on_page_error: continue
  max_consecutive_failures: 3
  grading:
    # Pages graded strictly below this letter join the review queue
    # (reason grade_below_threshold) and the rerun manifest. Omit to keep
    # grading purely informational (the default).
    review_below_grade: C
    # Band thresholds are overridable per axis; these are the defaults.
    # thresholds:
    #   confidence: {A: 0.90, B: 0.80, C: 0.70, D: 0.55}
    #   required_column_coverage: {A: 1.0, B: 0.9, C: 0.7}
    #   arithmetic_pass_rate: {A: 0.98, B: 0.90, C: 0.75}
  # Add pages matching these rules to the review queue and rerun manifest.
  rerun_if:
    - grade_below: C
    - missing_required_columns: true
    - arithmetic_failure_rate_above: 0.05
  # Quarantine wins over rerun. Matching pages remain visible in audit.json
  # but are left out of rerun-manifest.yml.
  quarantine_if:
    - grade_below: D
  pricing:
    # Unit rates. PageLedger derives cost_usd from pages (and tokens, for
    # model-backed adapters); adapters never have to know dollar prices.
    # Omit these entirely to run with pages-only accounting and no dollar cost.
    cost_per_page: 0.0015
    # cost_per_1k_tokens: 0.50  # enable only when the adapter reports tokens
