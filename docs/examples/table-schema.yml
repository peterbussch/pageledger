# Example PageLedger schema for aligning OCR/VLM table output.

schema_version: "0.1"  # Config file format version.
name: demographic_table
description: Generic demographic table with place and population fields.
# Projects can add their own language-specific aliases here.

columns:
  - name: place_name
    aliases:
      - place
      - settlement
      - locality
    type: string
    required: true

  - name: population_total
    aliases:
      - total
      - population
    type: integer
    required: true

  - name: population_male
    aliases:
      - male
      - men
    type: integer
    required: false

  - name: population_female
    aliases:
      - female
      - women
    type: integer
    required: false

checks:
  - name: population_sum
    description: Total should equal male plus female when all fields exist.
    expression: population_total == population_male + population_female
    tolerance: 2
    severity: warning

quality:
  minimum_required_column_coverage: 1.0
  low_confidence_threshold: 0.70
